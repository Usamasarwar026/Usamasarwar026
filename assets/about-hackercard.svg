<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="100%" stop-color="#180a2e"/>
    </linearGradient>
    <linearGradient id="neonA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2ee6"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00ff9d"/>
    </linearGradient>
    <filter id="glowA" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b">
        <animate attributeName="stdDeviation" values="2;6;2" dur="2.4s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gridA" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7b2ff7" stroke-width="0.3" opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="900" height="420" fill="url(#bgA)"/>
  <rect width="900" height="420" fill="url(#gridA)"/>

  <!-- outer neon border -->
  <rect x="20" y="20" width="860" height="380" rx="10" fill="none" stroke="url(#neonA)" stroke-width="2" filter="url(#glowA)"/>

  <!-- header bar -->
  <rect x="20" y="20" width="860" height="46" rx="10" fill="#0f0524" opacity="0.9"/>
  <circle cx="45" cy="43" r="6" fill="#ff2ee6"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="65" cy="43" r="6" fill="#7b2ff7"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="85" cy="43" r="6" fill="#00e5ff"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="450" y="49" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#00e5ff" letter-spacing="3">
    ACCESS_GRANTED :: DEVELOPER_PROFILE.SYS
  </text>

  <!-- left: id block -->
  <text x="55" y="115" font-family="'Courier New', monospace" font-size="14" fill="#F0A868" letter-spacing="2">NAME</text>
  <text x="55" y="140" font-family="'Courier New', monospace" font-size="24" font-weight="700" fill="url(#neonA)" filter="url(#glowA)">Usama Sarwar</text>

  <text x="55" y="180" font-family="'Courier New', monospace" font-size="14" fill="#F0A868" letter-spacing="2">ROLE</text>
  <text x="55" y="203" font-family="'Courier New', monospace" font-size="17" fill="#ffffff">Full-Stack Developer</text>

  <text x="55" y="240" font-family="'Courier New', monospace" font-size="14" fill="#F0A868" letter-spacing="2">EDUCATION</text>
  <text x="55" y="263" font-family="'Courier New', monospace" font-size="17" fill="#ffffff">CS Graduate 🎓</text>

  <text x="55" y="300" font-family="'Courier New', monospace" font-size="14" fill="#F0A868" letter-spacing="2">STATUS</text>
  <text x="55" y="323" font-family="'Courier New', monospace" font-size="16" fill="#00e5ff">
    OPEN_TO_WORK
    <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
  </text>

  <!-- divider -->
  <line x1="470" y1="90" x2="470" y2="395" stroke="#7b2ff7" stroke-width="1" opacity="0.5"/>

  <!-- right: skill bars -->
  <text x="500" y="115" font-family="'Courier New', monospace" font-size="14" fill="#F0A868" letter-spacing="2">SKILL_MATRIX</text>

  <!-- React/Next.js -->
  <text x="500" y="145" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">React / Next.js</text>
  <rect x="500" y="153" width="330" height="8" rx="4" fill="#1a1436"/>
  <rect x="500" y="153" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" values="0;300" dur="1.6s" fill="freeze" begin="0.2s"/>
  </rect>

  <!-- Node/Express -->
  <text x="500" y="180" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">Node.js / Express</text>
  <rect x="500" y="188" width="330" height="8" rx="4" fill="#1a1436"/>
  <rect x="500" y="188" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" values="0;280" dur="1.6s" fill="freeze" begin="0.4s"/>
  </rect>

  <!-- React Native -->
  <text x="500" y="215" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">React Native</text>
  <rect x="500" y="223" width="330" height="8" rx="4" fill="#1a1436"/>
  <rect x="500" y="223" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" values="0;250" dur="1.6s" fill="freeze" begin="0.6s"/>
  </rect>

  <!-- Prisma/PostgreSQL -->
  <text x="500" y="250" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">Prisma / PostgreSQL</text>
  <rect x="500" y="258" width="330" height="8" rx="4" fill="#1a1436"/>
  <rect x="500" y="258" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" values="0;270" dur="1.6s" fill="freeze" begin="0.8s"/>
  </rect>

  <!-- TypeScript -->
  <text x="500" y="285" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">TypeScript</text>
  <rect x="500" y="293" width="330" height="8" rx="4" fill="#1a1436"/>
  <rect x="500" y="293" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" values="0;240" dur="1.6s" fill="freeze" begin="1.0s"/>
  </rect>

  <!-- Redux/TanStack -->
  <text x="500" y="320" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">Redux Toolkit / TanStack Query</text>
  <rect x="500" y="328" width="330" height="8" rx="4" fill="#1a1436"/>
  <rect x="500" y="328" width="0" height="8" rx="4" fill="url(#barFill)">
    <animate attributeName="width" values="0;260" dur="1.6s" fill="freeze" begin="1.2s"/>
  </rect>

  <text x="500" y="365" font-family="'Courier New', monospace" font-size="12" fill="#7b2ff7" letter-spacing="1">
    &gt; scanning_complete... 100%
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </text>

  <!-- scan line -->
  <rect x="20" y="0" width="860" height="3" fill="#00e5ff" opacity="0.3">
    <animate attributeName="y" values="20;390;20" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
