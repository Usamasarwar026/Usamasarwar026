<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05010d"/>
      <stop offset="100%" stop-color="#180a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2ee6"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b">
        <animate attributeName="stdDeviation" values="3;8;3" dur="2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#7b2ff7" stroke-width="0.4" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="900" height="260" fill="url(#bg1)"/>
  <rect width="900" height="260" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 40;0 0" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect width="900" height="260" fill="url(#bg1)" opacity="0.25"/>

  <line x1="0" y1="230" x2="900" y2="230" stroke="#00e5ff" stroke-width="1.5" opacity="0.5"/>
  <line x1="0" y1="228" x2="900" y2="228" stroke="#ff2ee6" stroke-width="0.6" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="1.6s" repeatCount="indefinite"/>
  </line>

  <text x="450" y="120" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="70" font-weight="900" fill="url(#neon)" filter="url(#neonGlow)" letter-spacing="6">
    USAMA SARWAR
  </text>

  <text x="450" y="165" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="20" fill="#00e5ff" letter-spacing="3">
    &lt; FULL-STACK DEVELOPER /&gt;
    <animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <text x="450" y="195" text-anchor="middle" font-family="'Courier New', monospace"
        font-size="15" fill="#ff2ee6" letter-spacing="2" opacity="0.85">
    CS GRADUATE • REACT • NEXT.JS • NODE.JS
  </text>

  <rect x="30" y="30" width="14" height="14" fill="none" stroke="#00e5ff" stroke-width="2">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="856" y="216" width="14" height="14" fill="none" stroke="#ff2ee6" stroke-width="2">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </rect>
</svg>
